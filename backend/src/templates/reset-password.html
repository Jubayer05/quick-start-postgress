<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
    <style>
      body { margin: 0; padding: 0; background: #f7f8fb; color: #0f172a; font-family: Arial, sans-serif; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px; }
      h1 { margin: 0 0 12px; font-size: 22px; font-weight: 700; }
      p { margin: 0 0 14px; line-height: 1.6; color: #475569; }
      .btn { display: inline-block; padding: 12px 20px; background: #2563eb; color: #fff !important; text-decoration: none; border-radius: 999px; font-weight: 700; }
      .mono { margin-top: 14px; padding: 12px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; word-break: break-all; color: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace; font-size: 12px; }
      .small { font-size: 12px; color: #64748b; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <p style="margin:0 0 8px; color:#64748b;">{{appName}}</p>
        <h1>Reset your password</h1>
        <p>Hello, <strong style="color:#0f172a;">{{userName}}</strong>. We received a request to reset your password.</p>
        <p><a class="btn" href="{{url}}">Reset password</a></p>
        <p class="small">If the button doesn’t work, copy and paste this link:</p>
        <div class="mono">{{url}}</div>
        <p class="small">If you didn’t request a password reset, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
